experiment:
  name: "learned_controller_evaluation"
  seed: 42

model:
  name_or_path: "BAAI/bge-small-en-v1.5"
  pooling_strategy: "cls"
  max_length: 512
  device: "auto"

dataset:
  name: "scifact"
  data_dir: "data"
  split: "test"

retrieval:
  top_k: 100
  batch_size: 32

controller:
  hidden_dim: 128
  num_layers: 2
  dropout: 0.1
  learning_rate: 0.001
  epochs: 10
  batch_size: 32
  train_split_ratio: 0.8

training:
  use_stability_features: true
  use_layer_index: true
  label_source: "retrieval_quality"

output:
  tables_dir: "results/tables"
  figures_dir: "results/figures"
  log_dir: "results/logs"
