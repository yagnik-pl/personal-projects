# ==============================================================================
# AdaptiveRetriever: Full-Depth Dense Baseline Configuration
# ==============================================================================

experiment:
  name: "baseline_scifact"
  description: "Full-depth dense retrieval baseline using BGE-small on SciFact"
  seed: 42

model:
  name_or_path: "BAAI/bge-small-en-v1.5"
  pooling_strategy: "cls"        # 'cls' for BGE, 'mean' for MiniLM/MPNet
  max_length: 512
  device: "auto"                 # 'auto', 'cuda', or 'cpu'

dataset:
  name: "scifact"                # 'scifact', 'nfcorpus', 'fiqa'
  data_dir: "data"
  split: "test"

retrieval:
  top_k: 10
  batch_size: 64

evaluation:
  metrics:
    - "Recall@1"
    - "Recall@5"
    - "Recall@10"
    - "Precision@1"
    - "Precision@5"
    - "Precision@10"
    - "MRR"
    - "nDCG@10"
  min_recall_at_10: 0.30         # Quality threshold assertion

output:
  tables_dir: "results/tables"
  metrics_dir: "results/metrics"
  log_dir: "results/logs"
  save_json: true
  save_csv: true
  save_markdown: true
